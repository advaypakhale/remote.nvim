name: Feature request
description: Suggest something
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#scope) for what is in scope.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including whether existing configuration already covers it.
